<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfaf6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100f0c">
<style>
  /* Self-hosted so the page never blocks on a third-party request. A Google
     Fonts <link> is render-blocking and the service worker cannot cache it,
     which stalls first paint exactly where it matters most: a weak signal in
     a grocery store. This is the variable font, so 500/600/700 all come from
     one 33 KB file. */
  @font-face {
    font-family: "Baloo 2";
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url("fonts/baloo2-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                   U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  /* Almanac theme only. Deliberately NOT in the service worker's SHELL: Paper
     users should never download it. It is cached opportunistically on first
     use (the fetch handler caches any same-origin file), so it works offline
     thereafter. font-display:swap means a fresh Almanac device shows Georgia
     until it loads. Variable, so all weights come from one 66 KB file. */
  @font-face {
    font-family: "Fraunces";
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url("fonts/fraunces-latin.woff2") format("woff2");
  }

  :root {
    --ink: #16140f;
    --mute: #6f6a5f;
    --faint: #a6a094;
    --line: #ddd8cc;
    --paper: #fbfaf6;
    --accent: oklch(68% 0.16 45);
    /* Same hue as --accent, darkened to clear 4.5:1 on paper. Bright --accent
       is for fills and rules; anything that is *text* uses this. */
    --accent-strong: oklch(54% 0.15 45);
    --accent2: oklch(52% 0.11 190);
    --edge: #8a8478;
    --pad: 22px;
    --display: "Baloo 2", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font: 400 16px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    padding: var(--pad);
    max-width: 1360px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  header { display: flex; justify-content: space-between; align-items: flex-end;
           gap: 16px; border-bottom: 3px solid var(--ink); border-radius: 2px; padding-bottom: 16px;
           /* clear the fixed top-left switch icon so the day is never covered */
           padding-left: 44px; }
  .day { font: 600 46px var(--display); line-height: 1; letter-spacing: -0.01em; color: var(--ink); }
  .sub { font-size: 14px; color: var(--mute); margin-top: 8px; letter-spacing: 0.01em; }
  .temp { font: 600 46px var(--display); line-height: 1; text-align: right; letter-spacing: -0.01em; color: var(--ink); }
  .cond { font-size: 14px; color: var(--mute); margin-top: 8px; text-align: right; }

  .cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
          gap: 40px; padding-top: 24px; }
  h2 { font: 700 15px var(--display); letter-spacing: 0.03em; text-transform: uppercase;
       color: var(--accent2); margin: 0 0 14px; }
  section + section { margin-top: 32px; }

  /* People are told apart by the shape of the rule, never by colour —
     e-ink hues are too muddy to carry meaning. */
  .ev { padding: 3px 0 3px 14px; margin-bottom: 14px; border-left: 3px solid var(--ink); }
  .ev.her { border-left-style: dashed; }
  .ev.both { border-left: 0; padding-left: 0; border-top: 2.5px solid var(--ink); padding-top: 10px; }
  /* The label identifies it, so no rule. Keeps the full-width bar meaning
     "this one is genuinely both of us" instead of appearing on every row. */
  .ev.labelled { border-left: 0; border-top: 0; padding-left: 0; padding-top: 3px; }
  .ev .what { font-size: 18px; font-weight: 500; letter-spacing: -0.005em; }
  /* Whose the event is about, when the line style cannot say it. */
  .ev .evlabel { color: var(--accent2); }
  .ev .evlabel::after { content: ' · '; color: var(--faint); }
  .ev .when { font-size: 13px; color: var(--mute); margin-top: 2px; }
  .ahead { font-size: 15px; color: var(--mute); line-height: 1.7; }
  .ahead b { color: var(--accent-strong); font-weight: 600; }

  /* Input and button share one underline so they read as a single control. */
  .addrow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
            border-bottom: 1.5px solid var(--line); transition: border-color 0.15s ease; }
  .addrow:focus-within { border-bottom-color: var(--ink); }
  .add { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 13px 2px;
         border: 0; background: none; color: var(--ink); outline: none; }
  .add::placeholder { color: var(--faint); }
  .addbtn { font: 600 14px var(--display); color: var(--accent-strong);
            background: none; border: 0; padding: 10px 6px; cursor: pointer;
            border-radius: 6px; flex: none; }
  .addbtn:disabled { color: var(--faint); cursor: default; }
  .addbtn:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

  /* Crossing something off is one tap and easy to do by accident one-handed,
     so the row greys out and offers Undo in place for a few seconds first. */
  .undoInline { margin-left: auto; flex: none; font: 600 13px var(--display);
                color: var(--accent-strong); background: none; border: 0;
                padding: 6px 8px; cursor: pointer; border-radius: 6px;
                text-decoration: underline; }
  .undoInline:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
             overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { font-size: 17px; padding: 12px 2px; border-bottom: 1px solid var(--line);
       cursor: pointer; display: flex; justify-content: flex-start;
       align-items: center; gap: 10px; user-select: none; }
  li::before { content: ''; width: 17px; height: 17px; flex: none; border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%;
               border: 2px solid var(--edge); }
  li:last-child { border-bottom: 0; }
  li:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 4px; }
  /* Greyed but still legible — you may be about to undo it. */
  li.going span:first-of-type { text-decoration: line-through; color: var(--faint); }
  li.going::before { background: var(--accent); border-color: var(--accent); }
  li .meta { font-size: 12px; color: var(--faint); white-space: nowrap; margin-left: auto; }
  li.empty { color: var(--mute); font-style: italic; cursor: default; border-bottom: 0; font-size: 15px; padding-left: 2px; }
  li.empty::before { display: none; }

  .bar { margin-top: 26px; border: 2.5px solid var(--ink); border-radius: 16px; padding: 16px 20px;
         display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
  .bar .msg { font: 600 21px var(--display); letter-spacing: -0.01em; }
  .bar .stamp { font-size: 11px; color: var(--faint); white-space: nowrap; }
  .bar.stale { border-style: dashed; border-color: var(--accent); }
  .bar.stale .msg { color: var(--accent); }
  .bar.stale .stamp { color: var(--ink); }

  .pending { font-size: 12px; color: var(--faint); margin-top: 12px; }

  /* Phone: the list is the point. Agenda drops below it. */
  @media (max-width: 720px) {
    :root { --pad: 18px; }
    .cols { grid-template-columns: 1fr; gap: 30px; }
    .lists { order: -1; }
    .day, .temp { font-size: 32px; }
    li { padding: 16px 2px; font-size: 18px; }
    .add { padding: 16px 2px; font-size: 18px; }
    .bar .msg { font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (prefers-color-scheme: dark) {
    :root { --ink: #f0efe9; --mute: #a6a196; --faint: #726c60;
            --line: #35322a; --paper: #100f0c; --accent: oklch(74% 0.1 60);
            --accent-strong: oklch(74% 0.1 60); --accent2: oklch(78% 0.1 190);
            --edge: #7d776a; }
  }

  /* ---------- themes (per device, chosen in the gear menu) ---------- */
  /* Specificity 0,2,0 beats the base :root and the dark :root (both 0,1,0), so
     a chosen theme wins in either OS mode. Paper (default/unset) keeps its
     automatic light/dark; pastel and jewel are single light looks for now. */
  :root[data-theme="pastel"] {
    --ink: #3f3147; --mute: #726578; --faint: #c6b8cb; --line: #ecdcec; --paper: #fdf6fb;
    --accent: #d98cc0; --accent-strong: #a2317c; --accent2: #6257b8; --edge: #957e99;
  }
  :root[data-theme="jewel"] {
    --ink: #241a3a; --mute: #665b80; --faint: #a99fc0; --line: #e2dcef; --paper: #faf7f0;
    --accent: #b0348a; --accent-strong: #86206a; --accent2: #0f7250; --edge: #8a82a0;
    --display: Georgia, "Noto Serif", "Times New Roman", serif;
  }
  /* jewel: checkboxes become gem facets */
  :root[data-theme="jewel"] li::before { border-radius: 2px; transform: rotate(45deg); }

  /* Almanac: a daily luach. Warm cream, Fraunces serif, editorial rules — the
     one theme that also restyles structure, not just tokens. */
  :root[data-theme="almanac"] {
    --ink: #241d10; --mute: #6b5e42; --faint: #a2916f; --line: #d4c8ac; --paper: #f5eede;
    --accent: #a5381b; --accent-strong: #8a2f14; --accent2: #395c44; --edge: #8f7b54;
    --display: "Fraunces", Georgia, "Noto Serif", serif;
  }
  /* centred masthead + double rule */
  :root[data-theme="almanac"] header { flex-direction: column; align-items: center;
    text-align: center; gap: 4px; border-bottom-width: 3px; border-bottom-style: double;
    /* centered masthead clears the corner icon on its own; no left inset needed */
    padding-left: 0; }
  :root[data-theme="almanac"] header > div { text-align: center; }
  :root[data-theme="almanac"] .temp { font-size: 22px; margin-top: 2px; text-align: center; }
  :root[data-theme="almanac"] .cond { text-align: center; }
  :root[data-theme="almanac"] h2 { border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  :root[data-theme="almanac"] .bar { border-width: 3px; border-style: double; border-radius: 4px; }
  :root[data-theme="almanac"] .bar .msg { font-family: var(--display); }

  /* editorial event rows: time in a left column, identity kept in the rule */
  :root[data-theme="almanac"] .ev { display: flex; gap: 16px; align-items: baseline;
    padding: 5px 0 5px 12px; margin-bottom: 6px; border-top: 0; }
  :root[data-theme="almanac"] .ev.both { border-left: 4px double var(--ink); border-top: 0;
    padding-left: 11px; padding-top: 5px; }
  /* padding-left matches ruled rows (border + pad = 15px) so the time column aligns */
  :root[data-theme="almanac"] .ev.labelled { border-left: 0; padding-left: 15px; }
  :root[data-theme="almanac"] .ev .when { order: -1; min-width: 66px; margin-top: 0;
    font-family: var(--display); }
  :root[data-theme="almanac"] .ev .what { font-family: var(--display); font-weight: 500; font-size: 19px; }

  /* featured candle-lighting box: the almanac's key datum */
  :root[data-theme="almanac"] .shablines { border: 1px solid var(--line); border-radius: 2px;
    background: rgba(165, 56, 27, 0.05); text-align: center; padding: 16px 18px; margin-top: 10px; }
  :root[data-theme="almanac"] .shabline.primary .sl-lab { display: block; text-transform: uppercase;
    letter-spacing: .24em; font-size: 11px; color: var(--accent); margin-bottom: 4px; }
  :root[data-theme="almanac"] .shabline.primary .sl-val { display: block; font-family: var(--display);
    font-size: 38px; line-height: 1; font-weight: 600; color: var(--accent); }
  :root[data-theme="almanac"] .shabline:not(.primary) { font-size: 14px; color: var(--mute); margin-top: 10px; }

  /* ---------- week arc (all themes): the week building toward Shabbat ---------- */
  .weekarc { display: flex; gap: 6px; margin: 14px 0 0; }
  .weekarc i { flex: 1; height: 3px; background: var(--line); border-radius: 2px; }
  .weekarc i.past { background: var(--faint); }
  .weekarc i.now { background: var(--accent-strong); height: 6px; margin-top: -1.5px; }
  .weekarc i.shab { background: var(--accent2); height: 7px; margin-top: -2px; }
  /* width must be definite: as a flex-column child (the desktop frame) an auto
     margin with only max-width collapses the bar to its content width. */
  :root[data-theme="almanac"] .weekarc { width: 320px; max-width: 100%; margin: 14px auto 0; }

  /* ---------- emoji (optional, toggled in the gear menu) ---------- */
  .em { display: none; }
  :root.emoji .em { display: inline; }

  /* ---------- settings gear + menu ---------- */
  .gear { position: fixed; top: 12px; right: 12px; width: 34px; height: 34px; z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 0; border: 0;
    background: none; color: var(--faint); cursor: pointer; border-radius: 50%; }
  .gear:hover { color: var(--mute); background: rgba(128,128,128,0.10); }
  .gear:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .gear svg { width: 4px; height: 18px; fill: currentColor; }
  .menu { position: fixed; top: 52px; right: 12px; z-index: 21; min-width: 194px;
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 10px; box-shadow: 0 8px 28px rgba(0,0,0,0.14); }
  .menu[hidden] { display: none; }
  .menu h3 { font: 500 11px/1 var(--display); letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--faint); margin: 4px 8px 10px; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 11px; font: inherit;
    font-size: 15px; padding: 9px 8px; border: 0; background: none; color: var(--ink);
    cursor: pointer; border-radius: 9px; text-align: left; }
  .menu button:hover { background: rgba(128,128,128,0.10); }
  .menu button:disabled { color: var(--faint); cursor: not-allowed; opacity: 0.7; }
  .menu button:disabled:hover { background: none; }
  .menu button:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: -2px; }
  .menu .swatch { width: 18px; height: 18px; border-radius: 50%; flex: none; border: 1.5px solid; }
  .menu .check { margin-left: auto; color: var(--accent-strong); }
  .menu button[aria-pressed="false"] .check { visibility: hidden; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 4px; }

  /* ---------- desktop: keep the frame, scroll the columns ---------- */
  /* Long lists used to push the priority bar off the bottom. On desktop the page
     becomes a fixed-height frame — header and bar pinned — and each column
     scrolls its own overflow. Phone keeps natural top-to-bottom page scroll. */
  @media (min-width: 721px) {
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; }
    .cols { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
    .cols > div { min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
    .cols > div::-webkit-scrollbar { width: 7px; }
    .cols > div::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .cols > div::-webkit-scrollbar-track { background: transparent; }
    .bar, .pending { flex: none; }
    /* The dashboard content moved inside #dashboardView; rebuild the fixed
       frame on the wrapper. :not([hidden]) so setting `hidden` still wins and
       actually hides the view (an unguarded display would override it). */
    #dashboardView:not([hidden]) { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    #choresView:not([hidden]) { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    /* Same treatment, same reason: body sets overflow:hidden here, which
       propagates to the viewport, so a view that does not scroll its own
       overflow simply loses whatever falls below the fold. A tall board is the
       normal case on a laptop, and Task 9 puts drop targets down there. */
    #boardView:not([hidden]) { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  }

  /* top-left view switch (broom icon), mirroring the top-right gear */
  .switch { position: fixed; top: 12px; left: 12px; width: 34px; height: 34px; z-index: 20;
    display: flex; align-items: center; justify-content: center; padding: 0; border: 0;
    background: none; color: var(--faint); cursor: pointer; border-radius: 50%; }
  .switch:hover { color: var(--mute); background: rgba(128,128,128,0.10); }
  .switch:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .switch svg { width: 21px; height: 21px; }
  .switch .ic-back { display: none; }
  .switch.on .ic-broom { display: none; }
  .switch.on .ic-back { display: block; }

  /* Second corner icon. Only drawn on board-enabled devices, so the kitchen
     tablet and Zissy's phones still show exactly one. When either sub-view is
     open the surviving button becomes the back chevron and takes the 12px slot. */
  /* The base .switch rule above sets display:flex unconditionally; an author
     rule beats the UA [hidden]{display:none} rule regardless of specificity
     (same trap as #dashboardView/#choresView, guarded there with :not([hidden])
     — see comment near the desktop-frame media query). #boardToggle carries
     `hidden` until a board-enabled device is confirmed, so it needs its own
     higher-specificity override or it renders anyway. */
  .switch[hidden] { display: none; }
  .board-switch { left: 54px; }
  .switch.on { left: 12px; }
  .switch .ic-board { display: block; }
  .switch.on .ic-board { display: none; }
  /* Scoped to #dashboardView's own header, not any header under body.has-board —
     the chores view's header only ever shows the back chevron at the 12px slot
     and must not inherit this inset once has-board is set. The almanac override
     below repeats the #dashboardView scope so its specificity (1,3,2) still
     beats this rule's (1,1,2); dropping the ID from either side would flip it. */
  body.has-board #dashboardView header { padding-left: 84px; }
  :root[data-theme="almanac"] body.has-board #dashboardView header { padding-left: 0; }

  .board-head { display: flex; justify-content: space-between; align-items: baseline;
                gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .board-agenda { color: var(--mute); font-size: 14px; margin-bottom: 14px; }

  /* One grid for both layouts: five columns on a laptop, a single stacked
     column on a phone. Same DOM either way — only dragging is size-dependent. */
  .board-cols { display: grid; gap: 14px; grid-template-columns: 1fr; }
  .board-col h2 { font: 600 13px var(--display); color: var(--mute);
                  text-transform: uppercase; letter-spacing: 0.06em; margin: 0 0 8px; }
  .board-col.drop-target { outline: 2px dashed var(--accent-strong); outline-offset: 4px; }

  .card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
          margin-bottom: 8px; cursor: pointer; background: none; }
  .card:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  .card.dragging { opacity: 0.4; }
  .card-title { font-size: 15px; }
  .card-sub { font-size: 12px; color: var(--mute); margin-top: 3px; }
  .card-badge { margin-right: 5px; }
  .due-overdue { color: var(--accent-strong); font-weight: 600; }
  .due-today { font-weight: 600; }
  .due-soon { color: var(--mute); }
  .card-empty { color: var(--mute); font-style: italic; font-size: 14px; }

  /* The inline card editor is the card's sibling, not its child, so it sits in
     the column flow directly beneath it in both layouts. The accent edge ties it
     back to the card it belongs to. */
  .card-editor { border: 1px solid var(--line); border-left: 3px solid var(--accent-strong);
                 border-radius: 8px; padding: 10px; margin: -4px 0 10px;
                 display: flex; flex-direction: column; gap: 8px; }
  /* .add is borderless by design — it borrows the underline from .addrow, which
     the editor does not use. Give it its own, same weight, same focus cue. */
  .card-editor .add { font-size: 15px; padding: 7px 2px;
                      border-bottom: 1.5px solid var(--line);
                      transition: border-color 0.15s ease; }
  .card-editor .add:focus { border-bottom-color: var(--ink); }
  .card-editor-actions { display: flex; align-items: center; gap: 8px; }
  .card-del { margin-left: auto; }
  /* Armed for the confirming second tap — the same cue a pressed pill gets. */
  .card-del.armed { color: var(--accent-strong); border-color: var(--accent-strong); }
  /* Two pickers (label, column) share one row: a wider gap between the groups
     than inside them, so they do not read as one flat run of seven pills. */
  #addCardOpts { gap: 8px 16px; }

  @media (min-width: 900px) {
    .board-cols { grid-template-columns: repeat(5, 1fr); align-items: start; }
  }

  .chores-head { justify-content: flex-start; }
  #choresGroups { padding-top: 24px; }
  .chores-group { margin-top: 28px; }
  .chores-group.handled { opacity: 0.75; }
  li .cue { font-size: 12px; color: var(--faint); white-space: nowrap; margin-left: auto; }
  li.chore-add-owner { cursor: default; border-bottom: 0; padding-top: 6px; gap: 8px; }
  li.chore-add-owner::before { display: none; }
  .seg { font: 600 13px var(--display); color: var(--mute); background: none;
    border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .seg[aria-pressed="true"] { color: var(--accent-strong); border-color: var(--accent-strong); }
  /* chore rows: title + a muted "done means…" subline, with an inline editor */
  li.chore { align-items: flex-start; }
  li.chore::before { margin-top: 3px; }
  .chore-body { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
  .chore-sub { font-size: 12px; color: var(--faint); margin-top: 3px; line-height: 1.35; }
  .chore-edit { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; margin-bottom: 4px; }
  .seg-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chore-def-input { display: block; width: 100%; margin-top: 2px;
    border-bottom: 1.5px solid var(--line); transition: border-color 0.15s ease; }
  .chore-def-input::placeholder { color: var(--faint); }
  .chore-def-input:focus { border-bottom-color: var(--ink); }
  .rowbtn { margin-left: auto; flex: none; font: 600 13px var(--display); color: var(--accent-strong);
    background: none; border: 0; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
  .rowbtn:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
</style>
</head>
<body>

<div id="dashboardView">
<header>
  <div>
    <div class="day" id="day">—</div>
    <div class="sub" id="sub"></div>
  </div>
  <div>
    <div class="temp" id="temp">—</div>
    <div class="cond" id="cond"></div>
  </div>
</header>

<div class="weekarc" id="weekarc" aria-hidden="true"></div>

<div class="cols">
  <div>
    <section>
      <h2><span class="em">📅 </span>Today</h2>
      <div id="today"></div>
    </section>
    <section>
      <h2 id="aheadLabel">Tomorrow</h2>
      <div class="ahead" id="ahead"></div>
    </section>
  </div>

  <div class="lists">
    <section>
      <h2><span class="em">🛒 </span>Shopping</h2>
      <div class="addrow">
        <input class="add" id="addShopping" placeholder="Add to shopping" autocomplete="off"
               enterkeyhint="done" aria-label="Add to shopping list">
        <button class="addbtn" type="button" id="addShoppingBtn">Add</button>
      </div>
      <ul id="shopping"></ul>
    </section>
    <section>
      <h2><span class="em">✅ </span>To do</h2>
      <div class="addrow">
        <input class="add" id="addTodo" placeholder="Add a to-do" autocomplete="off"
               enterkeyhint="done" aria-label="Add a to-do">
        <button class="addbtn" type="button" id="addTodoBtn">Add</button>
      </div>
      <ul id="todo"></ul>
    </section>
    <section id="countdownWrap">
      <h2><span class="em">✨ </span>Coming up</h2>
      <div class="ahead" id="countdown"></div>
    </section>
  </div>
</div>

<div class="bar" id="bar">
  <div class="msg" id="barMsg">—</div>
  <div class="stamp" id="stamp"></div>
</div>
<div class="pending" id="pending"></div>
</div>

<div id="choresView" hidden>
  <header class="chores-head">
    <div class="day">Chores</div>
  </header>
  <div id="choresGroups"></div>
  <section class="chores-group">
    <h2>Add a chore</h2>
    <div class="addrow">
      <input class="add" id="addChore" placeholder="Add a chore" autocomplete="off"
             enterkeyhint="next" aria-label="Add a chore">
      <button class="addbtn" type="button" id="addChoreBtn">Add</button>
    </div>
    <input class="add chore-def-input" id="addChoreDef" autocomplete="off" enterkeyhint="done"
           placeholder='What does "done" mean? (optional)' aria-label="Description for the new chore">
    <ul><li class="chore-add-owner" id="choreAddOpts"></li></ul>
  </section>
</div>

<div id="boardView" hidden>
  <div class="board-head">
    <h1 class="day">Board</h1>
    <div class="seg-row" id="boardFilter"></div>
  </div>
  <div class="board-agenda" id="boardAgenda"></div>
  <div class="board-cols" id="boardColumns"></div>
  <section>
    <div class="addrow">
      <input class="add" id="addCard" placeholder="Add a card" autocomplete="off"
             enterkeyhint="done" aria-label="Add a card">
      <button class="addbtn" type="button" id="addCardBtn">Add</button>
    </div>
    <div class="seg-row" id="addCardOpts"></div>
  </section>
</div>

<button class="switch" id="choresToggle" type="button" aria-label="Switch to chores">
  <svg class="ic-broom" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 4 12 12"/>
    <path d="M12 12 15.5 15.5 10 21 6.5 17.5Z"/>
    <path d="M7.5 18.5 5.5 21 M10 20 8.5 22.5 M12.8 18.2 12 21"/>
  </svg>
  <svg class="ic-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 6l-6 6 6 6"/>
  </svg>
</button>

<button class="switch board-switch" id="boardToggle" type="button" aria-label="Switch to board" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect class="ic-board" x="3.5" y="4" width="4.5" height="16" rx="1"/>
    <rect class="ic-board" x="9.75" y="4" width="4.5" height="11" rx="1"/>
    <rect class="ic-board" x="16" y="4" width="4.5" height="7" rx="1"/>
    <path class="ic-back" d="M15 5l-7 7 7 7"/>
  </svg>
</button>

<button class="gear" id="gear" type="button" aria-label="Display settings" aria-haspopup="true">
  <svg viewBox="0 0 4 18" aria-hidden="true"><circle cx="2" cy="2" r="2"/><circle cx="2" cy="9" r="2"/><circle cx="2" cy="16" r="2"/></svg>
</button>
<div class="menu" id="menu" role="menu" aria-label="Display settings" hidden>
  <h3>Theme</h3>
  <button type="button" role="menuitemradio" data-theme="paper" aria-pressed="true">
    <span class="swatch" style="background:#fbfaf6; border-color:#d8632a"></span>Paper<span class="check">✓</span></button>
  <button type="button" role="menuitemradio" data-theme="pastel" aria-pressed="false">
    <span class="swatch" style="background:#fdf6fb; border-color:#d98cc0"></span>Pastel<span class="check">✓</span></button>
  <button type="button" role="menuitemradio" data-theme="jewel" aria-pressed="false">
    <span class="swatch" style="background:#faf7f0; border-color:#b0348a"></span>Jewel<span class="check">✓</span></button>
  <button type="button" role="menuitemradio" data-theme="almanac" aria-pressed="false">
    <span class="swatch" style="background:#f5eede; border-color:#a5381b"></span>Almanac<span class="check">✓</span></button>
  <hr>
  <button type="button" role="menuitemcheckbox" id="emojiToggle" aria-pressed="false">
    Emoji<span class="check">✓</span></button>
  <button type="button" role="menuitemcheckbox" id="awakeToggle" aria-pressed="false">
    Keep display awake<span class="check">✓</span></button>
</div>

<div id="live" class="sr-only" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="feeds.js"></script>
<script src="chores.js"></script>
<script src="board.js"></script>
<script src="app.js"></script>
</body>
</html>
